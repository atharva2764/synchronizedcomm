spring:
  application:
    name: ecom-inventory-service

  datasource:
    url: jdbc:h2:mem:inventorydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true

server:
  port: 8081


eureka:
  registry-with-eureka: true
  fetch-registry: true